name: Scheduled Fuzzing

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Run Fuzzers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Fuzz lmp_message_read_from
        run: cargo fuzz run lmp_message_read_from -- -runs=10000

      - name: Fuzz lumiml_parser
        run: cargo fuzz run lumiml_parser -- -runs=10000
